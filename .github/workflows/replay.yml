# SPDX-License-Identifier: MIT
name: Replay
on:
  push:
  pull_request:
jobs:
  checks:
    name: Manifest and the three floating-point check programmes (normal and -O)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check MANIFEST.sha256
        run: sha256sum -c MANIFEST.sha256
      - name: Install pinned packages
        run: python -m pip install -r requirements.txt
      - name: Checks (normal)
        run: |
          for s in sharpness_check multitarget_gaussian_check revision_checks; do python -I -B code/$s.py --output-dir "$RUNNER_TEMP/normal/$s"; done
      - name: Checks under -O (every check raises; no assert)
        run: |
          for s in sharpness_check multitarget_gaussian_check revision_checks; do python -I -B -O code/$s.py --output-dir "$RUNNER_TEMP/opt/$s"; done
      - name: Working tree unchanged
        run: test -z "$(git status --porcelain)"
